services:
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: studyspace-backend:latest
    container_name: studyspace-backend-1
    environment:
      - INSTANCE_ID=backend-1
      - PORT=5000
      - DATABASE_URL=postgresql://neondb_owner:npg_gbpE8YK9yURL@ep-wispy-king-ayfkd1d7-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=supersecret_studyspace_jwt_key_2026_cse
      - NODE_ENV=production
    ports:
      - "5001:5000"
    restart: unless-stopped

  backend-2:
    image: studyspace-backend:latest
    container_name: studyspace-backend-2
    environment:
      - INSTANCE_ID=backend-2
      - PORT=5000
      - DATABASE_URL=postgresql://neondb_owner:npg_gbpE8YK9yURL@ep-wispy-king-ayfkd1d7-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=supersecret_studyspace_jwt_key_2026_cse
      - NODE_ENV=production
    ports:
      - "5002:5000"
    restart: unless-stopped
    depends_on:
      backend-1:
        condition: service_started

  backend-3:
    image: studyspace-backend:latest
    container_name: studyspace-backend-3
    environment:
      - INSTANCE_ID=backend-3
      - PORT=5000
      - DATABASE_URL=postgresql://neondb_owner:npg_gbpE8YK9yURL@ep-wispy-king-ayfkd1d7-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - JWT_SECRET=supersecret_studyspace_jwt_key_2026_cse
      - NODE_ENV=production
    ports:
      - "5003:5000"
    restart: unless-stopped
    depends_on:
      backend-1:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: studyspace-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: always
